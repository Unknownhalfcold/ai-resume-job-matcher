<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Resume Job Matcher</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#app" aria-label="AI Resume Job Matcher">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>AI Resume Job Matcher</span>
      </a>
      <nav class="nav-links" aria-label="页面导航">
        <a href="#app">Analyzer</a>
        <a href="#result">Result</a>
        <a href="docs/scoring.html">Scoring</a>
        <a href="https://github.com/Unknownhalfcold/ai-resume-job-matcher">GitHub</a>
      </nav>
    </header>

    <main>
      <section class="workspace" id="app" aria-labelledby="page-title">
        <div class="workspace-heading">
          <div>
            <p class="eyebrow">Local rule-based MVP</p>
            <h1 id="page-title">简历与岗位匹配分析</h1>
          </div>
          <div class="status-strip" aria-label="当前版本状态">
            <span>v0.1</span>
            <span>Rule-based</span>
          </div>
        </div>

        <div class="tool-layout">
          <section class="input-panel" aria-labelledby="input-title">
            <div class="panel-heading">
              <h2 id="input-title">输入</h2>
              <div class="actions">
                <button class="button secondary" id="load-sample" type="button">载入示例</button>
                <button class="button ghost" id="clear-all" type="button">清空</button>
              </div>
            </div>

            <div class="text-grid">
              <label class="field">
                <span>简历文本</span>
                <textarea id="resume-input" spellcheck="false" placeholder="粘贴简历内容"></textarea>
              </label>
              <label class="field">
                <span>岗位 JD</span>
                <textarea id="job-input" spellcheck="false" placeholder="粘贴岗位描述"></textarea>
              </label>
            </div>

            <div class="runbar">
              <button class="button primary" id="analyze-button" type="button">开始分析</button>
              <p class="run-note" id="run-note">关键词库加载中</p>
            </div>
          </section>

          <section class="result-panel" id="result" aria-labelledby="result-title">
            <div class="panel-heading">
              <h2 id="result-title">结果</h2>
              <button class="button secondary" id="copy-json" type="button" disabled>复制 JSON</button>
            </div>

            <div class="score-board" aria-live="polite">
              <div class="score-ring" id="score-ring" style="--score: 0">
                <div>
                  <strong id="score-value">--</strong>
                  <span>/100</span>
                </div>
              </div>
              <div class="score-meta">
                <p class="score-label" id="score-label">等待分析</p>
                <p id="score-detail">输入简历和岗位 JD 后生成结果</p>
                <div class="metric-row">
                  <span><strong id="matched-weight">0</strong> 已匹配权重</span>
                  <span><strong id="total-weight">0</strong> 岗位总权重</span>
                </div>
              </div>
            </div>

            <div class="result-grid">
              <section class="result-block" aria-labelledby="matched-title">
                <h3 id="matched-title">已匹配关键词</h3>
                <div class="pill-list" id="matched-list"></div>
              </section>

              <section class="result-block" aria-labelledby="missing-title">
                <h3 id="missing-title">缺失关键词</h3>
                <div class="pill-list" id="missing-list"></div>
              </section>
            </div>

            <section class="result-block suggestions" aria-labelledby="suggestion-title">
              <h3 id="suggestion-title">优化建议</h3>
              <ol id="suggestion-list"></ol>
            </section>
          </section>
        </div>
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
