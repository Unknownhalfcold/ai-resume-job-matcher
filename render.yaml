services:
  - type: web
    name: ai-resume-job-matcher-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGINS
        value: https://www.jobmatcher.win,https://jobmatcher.win,https://unknownhalfcold.github.io,http://localhost:8000,http://127.0.0.1:8000
      - key: AUTH_TOKEN_TTL_DAYS
        value: "14"
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_STYLE
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "28"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "2000"
      - key: LLM_RETRY_ON_SCHEMA_ERROR
        value: "false"
      - key: MAX_LLM_CONCURRENCY
        value: "10"
      - key: RATE_LIMIT_SALT
        sync: false
      - key: SUPABASE_URL
        value: https://pobhsdhecsaxvnargdpa.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_CtINPU0xxKzoPlVvffmtYQ_MkkYmBqy
      - key: SUPABASE_REQUIRE_EMAIL_CONFIRMATION
        value: "true"
